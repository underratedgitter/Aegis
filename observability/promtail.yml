server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: aegis-json-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: aegis
          __path__: /var/log/aegis/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
      - labels:
          service:
          level:

