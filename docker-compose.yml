# Keep container logs bounded so a long-running stack cannot fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Applied to the Aegis images: proper signal handling, no Linux capabilities, a read-only
# root filesystem (state lives on the mounted volumes; /tmp is a tmpfs), and enough time
# after SIGTERM for the engine to drain and the database to close (30s covers the 10s HTTP drain plus the 15s engine join).
x-aegis-hardening: &aegis-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  logging: *default-logging

# Hardening settings read by every Aegis process; the defaults match aegis/settings.py.
x-aegis-security-env: &aegis-security-env
  AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:-}
  AEGIS_AUTH_FAIL_MAX: ${AEGIS_AUTH_FAIL_MAX:-10}
  AEGIS_AUTH_FAIL_WINDOW: ${AEGIS_AUTH_FAIL_WINDOW:-60}
  AEGIS_MAX_BODY_BYTES: ${AEGIS_MAX_BODY_BYTES:-65536}

services:
  control:
    build: .
    command: python -m aegis.control_main
    environment:
      <<: *aegis-security-env
      AEGIS_POLL_SECONDS: ${AEGIS_POLL_SECONDS:-5}
      AEGIS_RESOLUTION_CYCLES: ${AEGIS_RESOLUTION_CYCLES:-2}
      AEGIS_SIGNAL_EVENT_INTERVAL: ${AEGIS_SIGNAL_EVENT_INTERVAL:-60}
      AEGIS_DETECTION_CYCLES: ${AEGIS_DETECTION_CYCLES:-2}
      AEGIS_BLIND_SECONDS: ${AEGIS_BLIND_SECONDS:-300}
      AEGIS_REOPEN_COOLDOWN_SECONDS: ${AEGIS_REOPEN_COOLDOWN_SECONDS:-300}
      AEGIS_CYCLE_TIMEOUT_SECONDS: ${AEGIS_CYCLE_TIMEOUT_SECONDS:-60}
      AEGIS_ENGINE_STALE_INTERVALS: ${AEGIS_ENGINE_STALE_INTERVALS:-3}
      AEGIS_ENGINE_MAX_BACKOFF_SECONDS: ${AEGIS_ENGINE_MAX_BACKOFF_SECONDS:-60}
      AEGIS_SHUTDOWN_GRACE_SECONDS: ${AEGIS_SHUTDOWN_GRACE_SECONDS:-10}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      CHECKOUT_URL: http://checkout:8000
      INVENTORY_URL: http://inventory:8000
      AEGIS_DB_PATH: /data/aegis.db
      AEGIS_LOG_DIR: /var/log/aegis
      AEGIS_RUNBOOK_DIR: /app/runbooks
      AEGIS_API_KEY: ${AEGIS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AEGIS_REMEDIATION_DRY_RUN: ${AEGIS_REMEDIATION_DRY_RUN:-false}
      AEGIS_REMEDIATION_MAX_ATTEMPTS: ${AEGIS_REMEDIATION_MAX_ATTEMPTS:-3}
      AEGIS_REMEDIATION_BACKOFF_MS: ${AEGIS_REMEDIATION_BACKOFF_MS:-500}
      AEGIS_REMEDIATION_TIMEOUT_SECONDS: ${AEGIS_REMEDIATION_TIMEOUT_SECONDS:-5}
      AEGIS_REMEDIATION_MAX_PER_WINDOW: ${AEGIS_REMEDIATION_MAX_PER_WINDOW:-5}
      AEGIS_REMEDIATION_WINDOW_SECONDS: ${AEGIS_REMEDIATION_WINDOW_SECONDS:-300}
      AEGIS_REMEDIATION_VERIFY_SECONDS: ${AEGIS_REMEDIATION_VERIFY_SECONDS:-180}
      AEGIS_REMEDIATION_VERIFY_INTERVAL: ${AEGIS_REMEDIATION_VERIFY_INTERVAL:-5}
      AEGIS_REMEDIATION_ALLOWED_ACTIONS: ${AEGIS_REMEDIATION_ALLOWED_ACTIONS:-checkout:clear_fault,checkout:scale_simulation,inventory:clear_fault,inventory:scale_simulation}
    volumes:
      - aegis-data:/data
      - aegis-logs:/var/log/aegis
    ports:
      - "${AEGIS_BIND_ADDR:-127.0.0.1}:8000:8000"
    depends_on:
      checkout:
        condition: service_healthy
      inventory:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/readyz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    <<: *aegis-hardening

  checkout:
    build: .
    command: python -m aegis.service_main
    environment:
      <<: *aegis-security-env
      SERVICE_NAME: checkout
      DEPENDENCY_URL: http://inventory:8000
      LOG_PATH: /var/log/aegis/checkout.jsonl
      AEGIS_API_KEY: ${AEGIS_API_KEY:-}
    volumes:
      - aegis-logs:/var/log/aegis
    ports:
      - "${AEGIS_BIND_ADDR:-127.0.0.1}:${CHECKOUT_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/healthz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      inventory:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    restart: unless-stopped
    <<: *aegis-hardening

  inventory:
    build: .
    command: python -m aegis.service_main
    environment:
      <<: *aegis-security-env
      SERVICE_NAME: inventory
      LOG_PATH: /var/log/aegis/inventory.jsonl
      AEGIS_API_KEY: ${AEGIS_API_KEY:-}
    volumes:
      - aegis-logs:/var/log/aegis
    ports:
      - "${AEGIS_BIND_ADDR:-127.0.0.1}:8081:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/healthz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    restart: unless-stopped
    <<: *aegis-hardening

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${AEGIS_BIND_ADDR:-127.0.0.1}:9091:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${AEGIS_BIND_ADDR:-127.0.0.1}:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - aegis-logs:/var/log/aegis:ro
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${AEGIS_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    restart: unless-stopped
    logging: *default-logging

volumes:
  aegis-data:
  aegis-logs:
  prometheus-data:
  grafana-data:
