services:
  control:
    build: .
    command: python -m aegis.control_main
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      CHECKOUT_URL: http://checkout:8000
      INVENTORY_URL: http://inventory:8000
      AEGIS_DB_PATH: /data/aegis.db
      AEGIS_LOG_DIR: /var/log/aegis
      AEGIS_RUNBOOK_DIR: /app/runbooks
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - aegis-data:/data
      - aegis-logs:/var/log/aegis
    ports:
      - "8000:8000"
    depends_on:
      - checkout
      - inventory
      - prometheus
      - loki

  checkout:
    build: .
    command: python -m aegis.service_main
    environment:
      SERVICE_NAME: checkout
      DEPENDENCY_URL: http://inventory:8000
      LOG_PATH: /var/log/aegis/checkout.jsonl
    volumes:
      - aegis-logs:/var/log/aegis
    ports:
      - "8080:8000"

  inventory:
    build: .
    command: python -m aegis.service_main
    environment:
      SERVICE_NAME: inventory
      LOG_PATH: /var/log/aegis/inventory.jsonl
    volumes:
      - aegis-logs:/var/log/aegis
    ports:
      - "8081:8000"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - aegis-logs:/var/log/aegis:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  aegis-data:
  aegis-logs:
